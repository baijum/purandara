# XcodeGen spec — source of truth for Purandara.xcodeproj.
# Regenerate after adding/removing files:  cd iosApp && xcodegen generate
name: Purandara
options:
  bundleIdPrefix: com.baijum.purandara
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    # Static shared.framework produced by `./gradlew :shared:link<Type>FrameworkIos*`
    "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": ["$(inherited)", "$(SRCROOT)/../shared/build/bin/iosArm64/$(KOTLIN_BUILD_TYPE)Framework"]
    "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(inherited)", "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/$(KOTLIN_BUILD_TYPE)Framework"]
  configs:
    Debug:
      KOTLIN_BUILD_TYPE: debug
    Release:
      KOTLIN_BUILD_TYPE: release
targets:
  Purandara:
    type: application
    platform: iOS
    sources:
      - Purandara
      # Bundled samples, shared with Android; copied as a folder so paths
      # match HarmoniumBank.assetPath(), e.g. audio/harmonium/49.flac.
      - path: ../audio
        type: folder
        buildPhase: resources
      # SwiftF0 pitch model, shared with Android (models/swift_f0_model.onnx).
      - path: ../models
        type: folder
        buildPhase: resources
    dependencies:
      # Static ONNX Runtime C framework; fetched by setup_onnxruntime.sh.
      - framework: Frameworks/onnxruntime.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baijum.purandara.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Purandara
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sing along listens to your voice to show how close each swara is. Audio stays on this device and is never recorded."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9QBV46NATP
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "shared"]
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."

          # Discover a Homebrew JDK when JAVA_HOME is unset (e.g. Xcode Cloud).
          if [ -z "${JAVA_HOME:-}" ]; then
              for JDK_VER in 21 17; do
                  BREW_JDK="$(brew --prefix openjdk@${JDK_VER} 2>/dev/null || true)"
                  if [ -n "$BREW_JDK" ] && [ -d "$BREW_JDK" ]; then
                      export JAVA_HOME="$BREW_JDK"
                      break
                  fi
              done
          fi

          if [ "${CONFIGURATION}" = "Debug" ]; then BUILD_TYPE="Debug"; else BUILD_TYPE="Release"; fi

          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
              if [ "${ARCHS}" = "x86_64" ]; then
                  TARGET="link${BUILD_TYPE}FrameworkIosX64"
              else
                  TARGET="link${BUILD_TYPE}FrameworkIosSimulatorArm64"
              fi
          else
              TARGET="link${BUILD_TYPE}FrameworkIosArm64"
          fi

          ./gradlew :shared:${TARGET} -Dorg.gradle.java.installations.auto-download=false
  PurandaraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PurandaraTests
    dependencies:
      - target: Purandara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baijum.purandara.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  PurandaraUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0" # performAccessibilityAudit()
    sources:
      - PurandaraUITests
    dependencies:
      - target: Purandara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baijum.purandara.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Purandara
schemes:
  Purandara:
    build:
      targets:
        Purandara: all
        PurandaraTests: [test]
        PurandaraUITests: [test]
    test:
      targets:
        - PurandaraTests
        - PurandaraUITests
