name: iOS CI flake rerun

# Runner-load flakes cost a manual rerun on most PRs (issue #28): the audit
# machinery timing out, roaming Dynamic Type (element-less too) and element-less hit-area false
# positives on plain screens, the count-in test on a stalled simulator, and
# setup-java 504s from the adoptium CDN. When iOS CI fails on its first
# attempt with a known signature, rerun the failed job ONCE, so real
# regressions still fail (with two attempts) and every rerun is visible.
#
# This runs as its own workflow, after iOS CI completes: inside the failing
# job the run is still in progress, so its log can't be read and it can't be
# rerun (the in-job step this replaces never matched, from 2026-11-10 on).

on:
  workflow_run:
    workflows: ["iOS CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun once on a known runner-load flake
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Fail loudly if the log can't be read, rather than calling it "not a flake".
          log=$(gh run view "$RUN_ID" --log-failed)
          if grep -qE "Audit failed to complete in time|Dynamic Type font sizes are partially unsupported|Dynamic Type font sizes are unsupported — \?|Hit area is too small — \?|count-in is shown first|Unexpected HTTP response: 504" <<<"$log"; then
            echo "Known runner-load flake signature; rerunning the failed job once"
            gh run rerun "$RUN_ID" --failed
          else
            echo "Failure signature is not a known flake; leaving it failed"
          fi
