name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image default, 16.4, is not supported: its Swift 6 compiler flags
      # View-member actor isolation the newer SDKs infer correctly, and its
      # iOS 18 audit reports Contrast / Dynamic Type / clipping failures the
      # audit on iOS 26+ does not (the UI tests are tuned to that audit; see
      # AGENTS.md). Select the newest Xcode on the macos-15 image (issue #8).
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@cf4beec8b4cca436a7b646657f74edc125658df8 # v6.1.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Cache ONNX Runtime xcframework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iosApp/Frameworks
          key: onnxruntime-${{ hashFiles('iosApp/setup_onnxruntime.sh') }}
      - name: Download ONNX Runtime (checksummed)
        run: bash iosApp/setup_onnxruntime.sh
      - name: Build and test
        run: |
          SIM=$(xcrun simctl list devices available iPhone -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r))")
          xcodebuild -project iosApp/Purandara.xcodeproj -scheme Purandara \
            -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO build test
