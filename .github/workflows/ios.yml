name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # macos-26 (Xcode 26.6, iOS 26.x runtimes): the UI tests are tuned to the
    # iOS 26-era accessibility audit (AGENTS.md) and only pass there — Xcode
    # 16.4's compile-time actor isolation and its iOS 18 audit both fail.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin the documented toolchain rather than the image default (issue #8).
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@cf4beec8b4cca436a7b646657f74edc125658df8 # v6.1.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Cache ONNX Runtime xcframework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iosApp/Frameworks
          key: onnxruntime-${{ hashFiles('iosApp/setup_onnxruntime.sh') }}
      - name: Download ONNX Runtime (checksummed)
        run: bash iosApp/setup_onnxruntime.sh
      - name: Build and test
        run: |
          # Prefer an iPhone 17 Pro, the device class the audit findings were tuned on.
          SIM=$(xcrun simctl list devices available iPhone -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          phones=[x for r in d.values() for x in r]
          pick=[p['udid'] for p in phones if p['name']=='iPhone 17 Pro'] or [p['udid'] for p in phones]
          print(pick[0])")
          xcodebuild -project iosApp/Purandara.xcodeproj -scheme Purandara \
            -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO build test
