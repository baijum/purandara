name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # The xcode-27 image matches the toolchain the UI tests are tuned and
    # green on (Xcode 27.2, iOS 27): Xcode 16.4 fails at compile time (actor
    # isolation) and Xcode 26.x's audit reports contrast false positives on
    # passing pairs (10:1, 8.8:1, 21:1 vs 4.5:1 required) that Xcode 27's
    # audit does not (issue #8).
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin the toolchain the tests are green on locally (Xcode 27.2, issue #8);
      # the image default is 27.1.
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@cf4beec8b4cca436a7b646657f74edc125658df8 # v6.1.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Cache ONNX Runtime xcframework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iosApp/Frameworks
          key: onnxruntime-${{ hashFiles('iosApp/setup_onnxruntime.sh') }}
      - name: Download ONNX Runtime (checksummed)
        run: bash iosApp/setup_onnxruntime.sh
      - name: Build and test
        run: |
          # Prefer an iPhone; the image's presets on the selected runtime are
          # fine now that the contrast audit's environment noise is logged
          # rather than fatal (issue #8).
          SIM=$(xcrun simctl list devices available iPhone -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          phones=[x for r in d.values() for x in r]
          for name in ('iPhone 17 Pro', 'iPhone 18 Pro'):
              pick=[p['udid'] for p in phones if p['name']==name]
              if pick: break
          else:
              pick=[p['udid'] for p in phones]
          print(pick[0])")
          xcodebuild -project iosApp/Purandara.xcodeproj -scheme Purandara \
            -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO build test
